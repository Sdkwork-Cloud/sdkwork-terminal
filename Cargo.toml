# SDKWork build-composition workspace root for sdkwork-terminal.
# Generated API assembly crates under crates/* are workspace members; sibling
# and cross-repo SDKWork path dependencies are declared once in this table.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-api-terminal-assembly = { path = "crates/sdkwork-api-terminal-assembly" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust", package = "sdkwork-utils-rust" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract", package = "sdkwork-web-contract" }