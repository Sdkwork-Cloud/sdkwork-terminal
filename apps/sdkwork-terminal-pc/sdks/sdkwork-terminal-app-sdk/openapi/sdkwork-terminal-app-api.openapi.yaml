openapi: 3.1.0
info:
  title: SDKWork Terminal App API
  version: 1.0.0
  description: Authenticated Browser terminal session control API served by application.public-ingress.
servers: []
tags:
- name: terminalLocalRuntime
  description: Session, replay, and stream operations for the co-located terminal
    runtime
- name: terminalLocalRuntimeHealth
  description: Runtime-node health probes
paths:
  /app/v3/api/device/terminal/sessions:
    get:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.list
      summary: List active runtime sessions
      security:
      - AuthToken: []
        AccessToken: []
      responses:
        '200':
          description: Caller-owned path-free terminal session index
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ProjectTerminalSessionIndexSnapshot'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
    post:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.create
      summary: Create an interactive project terminal session
      security:
      - AuthToken: []
        AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectTerminalSessionRequest'
      responses:
        '201':
          description: Created path-free project terminal session snapshot
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ProjectTerminalSessionCreatePayload'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not authorized to execute in this project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Project or project runtime location was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid session state or duplicate session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Selected project runtime location is unavailable for terminal
            execution
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      description: The server resolves the selected project runtime location after
        authentication. Client paths and execution authorities are not accepted.
  /app/v3/api/device/terminal/sessions/{sessionId}/replay:
    get:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.replay.list
      summary: Read bounded replay transcript for a session
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
      responses:
        '200':
          description: Caller-owned path-redacted terminal replay snapshot
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ProjectTerminalSessionReplaySnapshot'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
  /app/v3/api/device/terminal/sessions/{sessionId}/input:
    post:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.input
      summary: Write UTF-8 terminal input to a session
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeInputBody'
      responses:
        '200':
          description: Input accepted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/RuntimeNodeSessionInputSnapshot'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid session state or duplicate session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
  /app/v3/api/device/terminal/sessions/{sessionId}/input_bytes:
    post:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.inputBytes
      summary: Write raw terminal input bytes to a session
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeInputBytesBody'
      responses:
        '200':
          description: Input accepted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/RuntimeNodeSessionInputSnapshot'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid session state or duplicate session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
  /app/v3/api/device/terminal/sessions/{sessionId}/resize:
    post:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.resize
      summary: Resize terminal viewport for a session
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResizeBody'
      responses:
        '200':
          description: Resize accepted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/RuntimeNodeSessionResizeSnapshot'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid session state or duplicate session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
  /app/v3/api/device/terminal/sessions/{sessionId}/terminate:
    post:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.terminate
      summary: Terminate a runtime session
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/RuntimeNodeSessionTerminateSnapshot'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid session state or duplicate session
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
  /app/v3/api/device/terminal/sessions/{sessionId}/events:
    get:
      tags:
      - deviceTerminal
      operationId: device.terminal.sessions.events.stream
      summary: Attach to a session event stream (SSE)
      security:
      - AuthToken: []
        AccessToken: []
      parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid runtime bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Session or attachment not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-sdkwork-api-surface: app-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    SessionIdQuery:
      name: sessionId
      in: query
      required: true
      schema:
        type: string
  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnauthorizedError:
      description: Missing or invalid runtime bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFoundError:
      description: Session or attachment not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictError:
      description: Invalid session state or duplicate session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailableError:
      description: Runtime node is not ready to serve traffic
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    RuntimeNodeHealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    RuntimeNodeReadinessResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ready
    RuntimeNodeSessionInputSnapshot:
      type: object
      additionalProperties: true
    RuntimeNodeSessionResizeSnapshot:
      type: object
      additionalProperties: true
    RuntimeNodeSessionTerminateSnapshot:
      type: object
      additionalProperties: true
    RuntimeInputBody:
      type: object
      additionalProperties: false
      required:
      - input
      properties:
        input:
          type: string
    RuntimeInputBytesBody:
      type: object
      additionalProperties: false
      required:
      - inputBytes
      properties:
        inputBytes:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
    RuntimeResizeBody:
      type: object
      additionalProperties: false
      required:
      - cols
      - rows
      properties:
        cols:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - data
      - traceId
      properties:
        code:
          type: integer
          format: int32
          enum:
          - 0
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload typed per response schema.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required:
      - item
      properties:
        item:
          type: object
          additionalProperties: true
          description: Typed domain resource for the operation.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required:
      - items
      - pageInfo
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SdkWorkCommandData:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          type: boolean
          const: true
        resourceId:
          type: string
        status:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - offset
          - cursor
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: string
          pattern: ^[0-9]+$
        totalPages:
          type: integer
          minimum: 0
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    SdkWorkPlatformErrorCode:
      type: integer
      format: int32
      minimum: 40001
      maximum: 79999
      description: Platform or domain error code per API_SPEC.md 搂15.3.
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        i18nKey:
          type: string
          description: Optional stable localization key such as errors.result.40001.
        locale:
          type: string
          description: Optional effective BCP 47 locale used by framework message
            mapping.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: integer
          format: int32
          minimum: 40011
          maximum: 40099
        i18nKey:
          type: string
        params:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
    SdkWorkResourceResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkResourceData'
    SdkWorkListResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkPageData'
    SdkWorkCommandResponse:
      allOf:
      - $ref: '#/components/schemas/SdkWorkApiResponse'
      - type: object
        required:
        - data
        properties:
          data:
            $ref: '#/components/schemas/SdkWorkCommandData'
    CreateProjectTerminalSessionRequest:
      type: object
      additionalProperties: false
      required:
      - projectId
      - runtimeLocationId
      - command
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._:-]*$
        runtimeLocationId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._:-]*$
        command:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 2048
        cols:
          type: integer
          minimum: 1
          maximum: 500
        rows:
          type: integer
          minimum: 1
          maximum: 500
        modeTags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 128
    ProjectTerminalReplayEntry:
      type: object
      additionalProperties: false
      required:
      - sequence
      - kind
      - payload
      - occurredAt
      properties:
        sequence:
          type: integer
          minimum: 0
        kind:
          type: string
        payload:
          type: string
          description: Replay data. Project runtime metadata excludes the resolved
            root.
        occurredAt:
          type: string
    ProjectTerminalSessionCreatePayload:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - projectId
      - runtimeLocationId
      - target
      - state
      - createdAt
      - lastActiveAt
      - modeTags
      - tags
      - attachmentId
      - cursor
      - lastAckSequence
      - writable
      - invokedProgram
      - invokedArgs
      - replayEntry
      properties:
        sessionId:
          type: string
        projectId:
          type: string
        runtimeLocationId:
          type: string
        target:
          type: string
          const: server-runtime-node
        state:
          type: string
        createdAt:
          type: string
        lastActiveAt:
          type: string
        modeTags:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        attachmentId:
          type: string
        cursor:
          type: string
        lastAckSequence:
          type: integer
          minimum: 0
        writable:
          type: boolean
        invokedProgram:
          type: string
        invokedArgs:
          type: array
          items:
            type: string
        replayEntry:
          $ref: '#/components/schemas/ProjectTerminalReplayEntry'
    ProjectTerminalSessionDescriptor:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - workspaceId
      - target
      - state
      - createdAt
      - lastActiveAt
      - modeTags
      - tags
      - lastAckSequence
      - exitCode
      properties:
        sessionId:
          type: string
        workspaceId:
          type: string
        target:
          type: string
        state:
          type: string
        createdAt:
          type: string
        lastActiveAt:
          type: string
        modeTags:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        lastAckSequence:
          type: integer
          minimum: 0
        exitCode:
          type:
          - integer
          - 'null'
    ProjectTerminalSessionAttachmentDescriptor:
      type: object
      additionalProperties: false
      required:
      - attachmentId
      - sessionId
      - cursor
      - lastAckSequence
      - writable
      properties:
        attachmentId:
          type: string
        sessionId:
          type: string
        cursor:
          type: string
        lastAckSequence:
          type: integer
          minimum: 0
        writable:
          type: boolean
    ProjectTerminalSessionIndexSnapshot:
      type: object
      additionalProperties: false
      required:
      - sessions
      - attachments
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTerminalSessionDescriptor'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTerminalSessionAttachmentDescriptor'
    ProjectTerminalSessionReplaySnapshot:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - nextCursor
      - hasMore
      - entries
      properties:
        sessionId:
          type: string
        fromCursor:
          type:
          - string
          - 'null'
        nextCursor:
          type: string
        hasMore:
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTerminalReplayEntry'
