[package]
name = "sdkwork-routes-terminal-app-api"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
sdkwork-terminal-runtime-node = { path = "../sdkwork-terminal-runtime-node" }
sdkwork-terminal-session-runtime = { path = "../sdkwork-terminal-session-runtime" }
sdkwork-terminal-pty-runtime = { path = "../sdkwork-terminal-pty-runtime" }
sdkwork-utils-rust.workspace = true
sdkwork-web-contract = { path = "../../../../../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-core = { path = "../../../../../sdkwork-web-framework/crates/sdkwork-web-core" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
