# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/terminal/webserver.pid;
error_log /var/log/sdkwork/terminal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name terminal-dev.sdkwork.com terminal-dev.birdcoder.com terminal-dev.dtupay.com terminal-dev.noaper.com terminal-dev.sdkwork.cn terminal-dev.birdcoder.cn terminal-dev.dtupay.cn terminal-dev.noaper.cn terminal-dev.skubc.com terminal-dev.skubc.cn terminal-dev.zowalk.com terminal-dev.zowalk.cn terminal-dev.offer86.com terminal-dev.offer86.cn terminal-dev.86offer.com terminal-dev.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
