# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/terminal/webserver.pid;
error_log /var/log/sdkwork/terminal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name terminal-staging.sdkwork.com terminal-staging.birdcoder.com terminal-staging.dtupay.com terminal-staging.sdkwork.cn terminal-staging.birdcoder.cn terminal-staging.dtupay.cn terminal-staging.skubc.com terminal-staging.skubc.cn terminal-staging.zowalk.com terminal-staging.zowalk.cn terminal-staging.offer86.com terminal-staging.offer86.cn terminal-staging.86offer.com terminal-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
