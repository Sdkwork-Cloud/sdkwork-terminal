# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/terminal/webserver.pid;
error_log /var/log/sdkwork/terminal/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name terminal-test.sdkwork.com terminal-test.birdcoder.com terminal-test.dtupay.com terminal-test.noaper.com terminal-test.sdkwork.cn terminal-test.birdcoder.cn terminal-test.dtupay.cn terminal-test.noaper.cn terminal-test.skubc.com terminal-test.skubc.cn terminal-test.zowalk.com terminal-test.zowalk.cn terminal-test.offer86.com terminal-test.offer86.cn terminal-test.86offer.com terminal-test.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
