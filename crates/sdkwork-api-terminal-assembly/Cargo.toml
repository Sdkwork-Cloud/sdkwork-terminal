[package]
name = "sdkwork-api-terminal-assembly"
edition = "2021"
version = "0.1.0"
description = "Generated API assembly for sdkwork-terminal application HTTP plane."

[lib]
name = "sdkwork_api_terminal_assembly"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
sdkwork-web-bootstrap = { workspace = true }
sdkwork-web-core = { workspace = true }
